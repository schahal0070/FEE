<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Layout</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#0559eb;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}
.header{
    width:100%;
    height:220px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}
.circle-box{
    position:relative;
    width:240px;
    height:170px;
}
.circle{
    width:80px;
    height:80px;
    border:3px solid black;
    border-radius:50%;
    position:absolute;
}
.left{
    left:35px;
    top:65px;
}
.right{
    left:125px;
    top:65px;
}
.top{
    left:80px;
    top:20px;
}
</style>
</head>
<body>
<div class="header">
    <div class="circle-box">
        <div class="circle left"></div>
        <div class="circle right"></div>
        <div class="circle top"></div>
    </div>

</div>
</body>
</html>
