<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "style1.css">
</head>
<body>
    <header id = "btn1">Theme</header>
    <section class = "card">Once upon a time</section>
    <script>
        const btn1 = document.querySelector("#btn1");

        btn1.addEventListener("click", cbf);
        function cbf() {
            document.body.classList.toggle("darkTheme");
            if(btn1.textContent === "Theme1") {
                btn1.textContent = "Theme2";
            } else {
                btn1.textContent = "Theme1";
            }
        }
    </script>
</body>
</html>
